<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.title">Mingsong Liu</title>
<meta name="description" data-i18n-attr="content" data-i18n="meta.desc" content="Mingsong Liu, Mathematics with Computer Science.">
<script>
(function () {
  try {
    var t = localStorage.getItem("site-theme");
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="controls">
  <button type="button" id="theme-toggle">Dark</button>
  <span class="lang" role="group" data-i18n-attr="aria-label" data-i18n="lang.label" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="zh">中文</button>
  </span>
</div>

<main class="wrap">
  <p class="intro" data-i18n="intro">Mingsong Liu — undergraduate in Mathematics with Computer Science at Guangdong Technion – Israel Institute of Technology (GTIIT).</p>
  <ul class="links">
    <li><a href="https://github.com/msl-sc/rgbds-live">rgbds-live</a></li>
    <li><a href="https://github.com/msl-sc/asm-gameboy-Klotski">Klotski for the Game Boy</a></li>
    <li><a href="https://github.com/msl-sc/xv6-public">xv6</a></li>
  </ul>
</main>

<script src="assets/app.js"></script>
</body>
</html>
